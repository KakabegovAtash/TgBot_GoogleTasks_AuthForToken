<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доступ к Google Tasks</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ffb7b2;
            --secondary-pink: #ffdac1;
            --bg-gradient-start: #f8cdda;
            --bg-gradient-end: #1d2b64;
            --text-dark: #4a4a4a;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), #fdf2f8, var(--secondary-pink));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(255, 183, 178, 0.37);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .photo-gallery {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            position: relative;
        }

        .photo-card {
            width: 100px;
            height: 120px;
            background: white;
            padding: 8px 8px 25px 8px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transform: rotate(-5deg);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .photo-card:nth-child(2) {
            transform: rotate(5deg);
            margin-top: 10px;
        }

        .photo-card:hover {
            transform: rotate(0) scale(1.1);
            z-index: 2;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }

        .photo-pin {
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: #ff7e67;
            border-radius: 50%;
            box-shadow: inset -2px -2px 4px rgba(0, 0, 0, 0.2), 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 600;
            color: #d15c7e;
        }

        p {
            font-size: 1rem;
            margin-bottom: 30px;
            line-height: 1.5;
            color: #6d6d6d;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #fff;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            box-shadow: 0 10px 20px -10px rgba(255, 154, 158, 1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -10px rgba(255, 154, 158, 1);
        }

        .btn::after {
            content: '✨';
            position: absolute;
            right: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn:hover::after {
            opacity: 1;
        }

        .floating-heart {
            position: absolute;
            color: #ff9a9e;
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(10deg);
            }

            100% {
                transform: translateY(0) rotate(0deg);
            }
        }
    </style>
</head>

<body>
    <div class="floating-heart" style="top: 10%; left: 20%; font-size: 2rem; animation-delay: 0s;">💖</div>
    <div class="floating-heart" style="top: 30%; right: 15%; font-size: 1.5rem; animation-delay: 2s;">💕</div>
    <div class="floating-heart" style="bottom: 20%; left: 10%; font-size: 2.5rem; animation-delay: 4s;">💗</div>
    <div class="floating-heart" style="bottom: 15%; right: 25%; font-size: 1.8rem; animation-delay: 1s;">💓</div>

    <div class="container">
        <div class="photo-gallery">
            <div class="photo-card">
                <div class="photo-pin"></div>
                <!-- Замените photo1.jpg в папке static на свое фото -->
                <img src="/static/photo1.jpg" alt="Photo 1"
                    onerror="this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 120\'%3E%3Crect fill=\'%23ffdac1\' width=\'100\' height=\'120\'/%3E%3Ctext fill=\'%23d15c7e\' font-family=\'sans-serif\' font-size=\'14\' x=\'50\' y=\'60\' text-anchor=\'middle\'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E'">
            </div>
            <div class="photo-card">
                <div class="photo-pin"></div>
                <!-- Замените photo2.jpg в папке static на свое фото -->
                <img src="/static/photo2.jpg" alt="Photo 2"
                    onerror="this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 120\'%3E%3Crect fill=\'%23ffb7b2\' width=\'100\' height=\'120\'/%3E%3Ctext fill=\'%23fff\' font-family=\'sans-serif\' font-size=\'14\' x=\'50\' y=\'60\' text-anchor=\'middle\'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E'">
            </div>
        </div>

        <h1>Name_! 🌸</h1>
        <p>Нажми на кнопочку ниже, чтобы я получил доступ к твоим Google Задачам.🥰</p>

        <a href="/login" class="btn">Подключить задачи</a>
    </div>
</body>

</html>
